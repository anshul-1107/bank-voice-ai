[project]
name = "bank-voice-agent"
version = "0.1.0"
description = "Real-time, human-sounding banking voice agent (English + Hinglish) with a QA-first pipeline. Built on ideas from the realtime-phone-agents course."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.50",          # any OpenAI-compatible endpoint: Groq, OpenAI, Sarvam-M, vLLM
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
prod = [
    "redis>=5.0",            # per-call state + campaign queue
    "psycopg[binary]>=3.2",  # QA store in Postgres
    "opik>=1.9",             # tracing (same as the course repo)
    "prometheus-client>=0.20",
]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
bva-evals = "bank_voice_agent.evals.run:main"
bva-campaign = "bank_voice_agent.campaigns.cli:main"
bva-qa-report = "bank_voice_agent.qa.report:main"
bva-simulate = "bank_voice_agent.evals.simulate_call:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_voice_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
